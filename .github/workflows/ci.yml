name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Kein Postgres-Service nötig: prisma generate liest nur das Schema (keine
    # Verbindung), next build rendert die Datenrouten dynamisch statt zur
    # Build-Zeit (export const dynamic = "force-dynamic") — lokal verifiziert,
    # dass "npm run build" bei gestopptem Postgres erfolgreich durchläuft.
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Deterministisch, keine Fehlalarme — siehe docs/development/workflow.md.
      - name: Doku-Links prüfen
        run: npm run check:links

      # Kein separater "npx tsc --noEmit"-Schritt: next build führt den
      # TypeScript-Check bereits selbst durch ("Running TypeScript ..." in der
      # Build-Ausgabe) — ein eigenständiger tsc-Lauf davor schlägt auf einem
      # frischen Checkout sogar fehl, da next-env.d.ts auf .next/types/*
      # verweist, das erst durch diesen Build-Schritt entsteht (per echtem
      # CI-Lauf gefunden: PR #19, Run 32602553946 — lokal unbemerkt, weil das
      # eigene .next/ von vorherigen "npm run dev/build"-Läufen schon existierte).
      - name: Build (inkl. TypeScript-Check)
        run: npm run build
