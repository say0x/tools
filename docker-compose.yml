services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tools
      POSTGRES_PASSWORD: tools
      POSTGRES_DB: tools
    # Kein Host-Port-Mapping: der App-Container erreicht Postgres über das Docker-Netz
    # (Service-Name "postgres" in DATABASE_URL). Ein "5432:5432"-Mapping würde die DB mit
    # trivialen Zugangsdaten auf dem Host-Netz exponieren, ohne dass die App das braucht.
    # Für ad-hoc psql-Zugriff: `docker compose exec postgres psql -U tools`.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tools -d tools"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tools:tools@postgres:5432/tools
      NODE_ENV: production
      # Opt-in, standardmäßig aus — siehe docs/deployment/docker.md. Nur über eine
      # lokale .env-Datei (von Compose automatisch geladen, nicht Teil des Repos)
      # oder eine exportierte Shell-Variable auf "true" setzen, nie hier fest verdrahten.
      RESET_USER_DATA_ON_DEPLOY: ${RESET_USER_DATA_ON_DEPLOY:-false}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
